# 푸시·PR 마다 테스트를 돌고, 플러그인에 넣은 server/lib 를 다시 빌드할 수 있는지 확인한다
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 공용 엔진 core-code-agent 를 GitHub Packages 에서 받는다
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트 (벤치마크 위험 지점 검사 BenchmarkTest 포함)
        run: ./gradlew test pluginServer --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 벤치마크 채점 스크립트 테스트
        run: python3 -m unittest discover -s benchmark -v

      # 플러그인은 Java 17 이상에서 돌아야 한다 (README 의 요구 사항)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Java 17 로 MCP 서버가 뜨는지 확인
        run: |
          java -version
          # 요청을 보낸 뒤 응답이 올 때까지(최대 20초) 표준 입력을 열어 둔다.
          # 바로 닫으면 서버가 응답을 쓰기 전에 끝나는 경우가 있다
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            for i in $(seq 1 20); do grep -q '"serverInfo"' out.txt 2>/dev/null && break; sleep 1; done
          } | timeout 30 java -cp "server/lib/*" com.codeagent.mcp.McpCodeAgent > out.txt 2> err.txt || true
          cat out.txt
          grep -q '"serverInfo"' out.txt || (cat err.txt; exit 1)

      - name: 테스트 결과 보관
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/reports/tests/test
